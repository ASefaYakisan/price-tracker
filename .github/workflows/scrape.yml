name: Daily scrape

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC (09:00 Türkiye)
  workflow_dispatch:
    inputs:
      source:
        description: Source to scrape (all, books-toscrape, coingecko, tcmb, gold)
        default: all
      pages:
        description: Listing pages to crawl for HTML sources
        default: "3"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run scrape -- ${{ inputs.source || 'all' }} ${{ inputs.pages || '3' }}
        env:
          SUPABASE_URL: https://zaufbyefvjttfppirjrj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # Optional: without it, due alerts are only logged, not emailed.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: https://price-tracker-sefa-yksn.vercel.app
