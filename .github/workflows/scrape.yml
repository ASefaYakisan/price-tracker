name: Daily scrape

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC (09:00 Türkiye)
  workflow_dispatch:
    inputs:
      source:
        description: Source to scrape (all, books-toscrape, coingecko, tcmb, gold)
        default: all
      pages:
        description: Listing pages to crawl for HTML sources
        default: "3"
      telegram_min_drop:
        description: Smallest drop in % that goes into the Telegram message (lower it to test)
        default: "2"

# A second run (manual "Run workflow" while the 06:00 one is still going) waits instead of reading and mailing in parallel.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04 # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04)
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      # Chromium for links a plain request cannot read (src/browser-fetch.js).
      - run: npx playwright install --with-deps chromium
      # Tests run in ci.yml on every PR and push to main; they must not gate the daily read.
      - run: npm run scrape -- ${{ inputs.source || 'all' }} ${{ inputs.pages || '3' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # Optional scraping API for shops that block GitHub's servers (see README, "Blocked shops").
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          UNBLOCK_HOSTS: ${{ vars.UNBLOCK_HOSTS }}
          UNBLOCK_MONTHLY_LIMIT: ${{ vars.UNBLOCK_MONTHLY_LIMIT }}
          UNBLOCK_RENDER_HOSTS: ${{ vars.UNBLOCK_RENDER_HOSTS }}
          UNBLOCK_COUNTRY: ${{ vars.UNBLOCK_COUNTRY }}
          UNBLOCK_PREMIUM_HOSTS: ${{ vars.UNBLOCK_PREMIUM_HOSTS }}
          # Minutes after which no new link is started; skipped links are read first next time (src/refresh.js).
          SCRAPE_BUDGET_MINUTES: ${{ vars.SCRAPE_BUDGET_MINUTES }}
          # Optional: without it, due alerts are only logged, not emailed.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          # Optional: daily Telegram message with the day's price drops.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MIN_DROP: ${{ inputs.telegram_min_drop || '2' }}
          TELEGRAM_LANG: ${{ vars.TELEGRAM_LANG }}
          # Optional: copy prices to a Google Sheet (service account JSON + sheet id).
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      # New coins start with a month of real daily prices from CoinGecko (src/backfill.js); other sources start today.
      - run: npm run backfill
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      # Make a failed run visible on the run page (the job itself is already red).
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "### Daily scrape failed"
            echo
            echo "A step in this run failed (run: ${GITHUB_RUN_ID}). Prices and alerts for today may be missing."
            echo "Open the failed step above for the error; fix it and re-run with **Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"
