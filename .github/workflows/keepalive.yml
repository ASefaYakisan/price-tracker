name: Keep schedules alive

# GitHub disables scheduled workflows after 60 days without repository activity.
# This re-enables the price jobs every week without adding commits.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable the scheduled workflows and check them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in scrape.yml pending.yml; do
            gh workflow enable "$wf"
            state=$(gh workflow view "$wf" --json state --jq .state 2>/dev/null || gh api "repos/$GH_REPO/actions/workflows/$wf" --jq .state)
            echo "$wf: $state"
            [ "$state" = "active" ]
          done
