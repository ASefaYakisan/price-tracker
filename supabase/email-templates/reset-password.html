<!-- Supabase > Authentication > Emails > Reset password.
     Subject: Price Tracker password reset ({{ .Token }})
     The code in the subject makes every email unique, so Gmail shows each one on its own instead of folding it under the last one. -->
<div style="margin:0;padding:32px 16px;background:#f4f5fa;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1b2032">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e4e7f0;border-radius:16px;padding:32px">
    <div style="font-size:15px;font-weight:600;color:#4f5bd5">Price Tracker</div>
    <h1 style="margin:16px 0 8px;font-size:22px;line-height:1.3">Choose a new password</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#596079">
      Someone asked to reset the password for <strong>{{ .Email }}</strong>. Press the button to pick a new one. The link works once and expires in one hour.
    </p>
    <a href="{{ .ConfirmationURL }}"
       style="display:block;text-align:center;background:#4f5bd5;color:#ffffff;text-decoration:none;font-size:16px;font-weight:600;padding:14px 20px;border-radius:10px">
      Reset password
    </a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8a91a6">
      If you did not ask for this, ignore this email; your password stays the same.
    </p>
  </div>
</div>
